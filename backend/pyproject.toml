[project]
name = "rafkhata"
version = "0.1.0"
description = "Raf-Khata backend: API, worker and Bangla lecture processing pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "google-auth>=2.60.0",
    "google-genai>=2.28",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jiwer>=4.0.0",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "requests>=2.34.2",
    "sarvamai>=0.1.36",
    "soniox>=2.10.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rk = "rafkhata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rafkhata"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "SIM108"]
