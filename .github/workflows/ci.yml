name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rafkhata
          POSTGRES_PASSWORD: rafkhata
          POSTGRES_DB: rafkhata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rafkhata -d rafkhata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Tests (SQLite)
        run: uv run pytest -q

      - name: Tests (PostgreSQL, schema from Alembic migrations)
        run: uv run pytest -q
        env:
          RAFKHATA_TEST_DATABASE_URL: postgresql+psycopg://rafkhata:rafkhata@localhost:5432/rafkhata_test

  android:
    name: Android (build + tests + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests and lint
        run: ./gradlew --stacktrace :core-logic:test :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rafkhata-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/core-logic/build/reports/
          if-no-files-found: ignore
